name: Mappe Galatone 3D
on:
  workflow_dispatch:
    inputs:
      towns:
        description: "Slug dei paesi da aggiornare, separati da virgola (vuoto = tutti)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "galatone-3d/towns.json"
      - "galatone-3d/tools/**"
      - ".github/workflows/mappe-3d.yml"
permissions:
  contents: write
concurrency:
  group: mappe-3d-geofabrik
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Scarica OpenStreetMap del Sud Italia (Geofabrik)
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/sud.osm.pbf" https://download.geofabrik.de/europe/italy/sud-latest.osm.pbf
          ls -lh "$RUNNER_TEMP/sud.osm.pbf"
          osmium tags-filter "$RUNNER_TEMP/sud.osm.pbf" w/highway w/building w/landuse w/leisure -o "$RUNNER_TEMP/sud-filtrato.osm.pbf" --overwrite
      - name: Ritaglia i paesi
        env:
          TOWNS: ${{ github.event.inputs.towns }}
        run: node galatone-3d/tools/build-maps.js "$RUNNER_TEMP/sud-filtrato.osm.pbf"
      - name: Salva le mappe nel sito
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add galatone-3d/data
          git diff --cached --quiet && echo "Nessuna novità" && exit 0
          git commit -m "Mappe Galatone 3D aggiornate da OpenStreetMap"
          git pull --rebase origin main
          git push
